<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli - Filementor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo-icon"></div>
        <span>Filementor</span>
      </div>

      <ul class="nav-links">
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
        </li>
        <li class="nav-item active">
          <a href="#"><i class="fa-solid fa-box"></i> Ürünler</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-cart-shopping"></i> Siparişler</a>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <a href="/"><i class="fa-solid fa-arrow-left"></i> Mağazaya Dön</a>
      <a href="/logout">Çıkış Yap</a>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title">Ürünler</h1>

    <div class="table-container">
      <div class="table-top-bar">
        <h2 class="table-title">Tüm Ürünler</h2>
        
        <div class="actions-bar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Ürün ara...">
          </div>

          <button type="button" id="btnOpenAddModal" class="btn-add-product">
            <i class="fa-solid fa-plus"></i> Yeni Ürün Ekle
          </button>
        </div>
      </div>

      <table class="product-table">
        <thead>
          <tr>
            <th>Ürün</th>
            <th>Kategori</th>
            <th>Fiyat</th>
            <th>Stok</th>
            <th>Durum</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </main>

  <div id="productModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Yeni Ürün Ekle</h3>
        <button type="button" id="btnCloseModal" class="btn-close-modal">&times;</button>
      </div>

      <form id="productForm">
        <input type="hidden" id="editProductId" value="">

        <div class="form-group">
          <label for="pName">Ürün Başlığı</label>
          <input type="text" id="pName" placeholder="Örn: NFC Tag Keychains" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pCategory">Kategori</label>
            <input type="text" id="pCategory" placeholder="Örn: Elektronik" required>
          </div>
          <div class="form-group">
            <label for="pPrice">Fiyat (₺)</label>
            <input type="number" id="pPrice" placeholder="350" required min="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pStock">Stok Adedi</label>
            <input type="number" id="pStock" value="1" required min="0">
          </div>
          <div class="form-group">
            <label for="pImage">Görsel URL</label>
            <input type="text" id="pImage" placeholder="https://..." required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btnCancelModal" class="btn-cancel">İptal</button>
          <button type="submit" class="btn-submit">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
