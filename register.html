<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetici Kaydı — Filementor Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hanken Grotesk', sans-serif;
      background: #15130f;
      background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: #1c1a15;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      padding: 2rem;
    }
    .login-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #ff8a5c;
      text-align: center;
      margin-bottom: .75rem;
      letter-spacing: .4px;
    }
    .login-eyebrow::before { content: '; '; color: rgba(255,255,255,.35); }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 .5rem;
      text-align: center;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #9c9686;
      text-align: center;
      margin: 0 0 1.5rem;
      line-height: 1.4;
    }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .3px;
      color: #9c9686;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.14);
      background: #100e0b;
      color: #fff;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 0.95rem;
    }
    input:focus { outline: 2px solid #ff4d1c; outline-offset: 1px; }
    .hint {
      font-size: 0.72rem;
      color: #726c5e;
      margin: -0.7rem 0 1rem;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #ff4d1c;
      color: #fff;
      font-weight: 700;
      font-family: 'Hanken Grotesk', sans-serif;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background .15s;
    }
    button:hover { background: #c93807; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #ff8a7a;
      font-size: 0.85rem;
      margin: -0.5rem 0 1rem;
      min-height: 1em;
    }
    .success {
      color: #7cd992;
      font-size: 0.85rem;
      margin: -0.5rem 0 1rem;
      min-height: 1em;
      line-height: 1.4;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #9c9686;
      text-decoration: none;
    }
    .back-link:hover { color: #fff; }
  </style>
  <script src="js/api-config.js?v=3"></script>
</head>
<body>
  <div class="login-box">
    <div class="login-eyebrow">YÖNETİM PANELİ</div>
    <h1>📝 Yönetici Kaydı</h1>
    <p class="subtitle">Kayıt olduktan sonra hesabınız mevcut bir yönetici tarafından onaylanana kadar giriş yapamazsınız.</p>
    <form id="register-form">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" autocomplete="username" pattern="[a-z0-9_]{3,32}" required />
      <p class="hint">3-32 karakter, sadece küçük harf, rakam ve alt çizgi.</p>
      <label for="password">Şifre</label>
      <input type="password" id="password" autocomplete="new-password" minlength="10" required />
      <p class="hint">En az 10 karakter.</p>
      <label for="password2">Şifre (Tekrar)</label>
      <input type="password" id="password2" autocomplete="new-password" minlength="10" required />
      <p class="error" id="error-msg"></p>
      <p class="success" id="success-msg"></p>
      <button type="submit" id="submit-btn">Kayıt Ol</button>
    </form>
    <a class="back-link" href="login.html">← Giriş sayfasına dön</a>
  </div>

  <script src="js/register.js?v=1"></script>
</body>
</html>
