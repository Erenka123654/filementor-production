<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetici Girişi — Filementor Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="css/auth.css" rel="stylesheet" />
  <script src="js/api-config.js?v=3"></script>
</head>
<body>
  <div class="login-box login-box--narrow">
    <div class="login-eyebrow">YÖNETİM PANELİ</div>
    <h1 class="login-title--tight">🔒 Yönetici Girişi</h1>
    <form id="login-form">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" autocomplete="username" required />
      <label for="password">Şifre</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <p class="error" id="error-msg"></p>
      <button type="submit" id="submit-btn">Giriş Yap</button>
    </form>
    <a class="back-link" href="register.html">Hesabınız yok mu? Kayıt olun</a>
  </div>

  <script src="js/login.js?v=1"></script>
</body>
</html>
